 <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Alpha | Investigation Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <style>
.project-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 2rem;
      background: url("img/concrete-texture.png") center/cover no-repeat;
      color: #eee;
    }
    .project-page img {
      max-width: 70%;
      border: 8px solid rgb(204,188,167);
      box-shadow: 2px 2px 12px rgba(0,0,0,0.6);
      margin-bottom: 2rem;
    }
    .back-btn {
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      transition: background 0.3s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>

<div id="menu-placeholder"></div>
<script src="menu-loader.js"></script>

</body>
