<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conceptual Project's</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Architects+Daughter&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Page Loader & Orientation Gate overlay -->
    <div id="page-loader" class="page-loader">
        <div class="loader-content">
            <div class="loader-title">Concepts & Campaigns</div>
            <div class="loader-spinner-container">
                <svg class="handdrawn-spinner" viewBox="0 0 50 50">
                    <circle class="spinner-path" cx="25" cy="25" r="20" fill="none"></circle>
                </svg>
            </div>
            <div class="loader-text">Loading Sketchbook...</div>
            <div class="orientation-gate">
                <div class="phone-rotate-animation"></div>
                <p class="gate-text">Please rotate your device to landscape mode</p>
            </div>
        </div>
    </div>

    <!-- Tape-styled Back button linking back to index.html -->
    <a href="index.html" class="back-btn" aria-label="Back to Room">&larr; Back to Room</a>

    <!-- Aspect-Ratio Cover Container matching 1920x1080 of the background -->
    <div class="paper-container">
        <!-- The background drawing notebook -->
        <img class="paper-bg" src="Assets/Images/paperbkgr.jpg" alt="Paper background">

        <!-- Interactive Project Images (Clickable Links) -->
        <a href="#" class="paper-project-link paper-project-keyboard" aria-label="Parasocial Keyboard Project Details">
            <img class="paper-project-img" src="Assets/Images/paperimg1.png" alt="Parasocial Keyboard Project Color">
        </a>
        <a href="#" class="paper-project-link paper-project-gulp" aria-label="Gulp Flyer and Label Project Details">
            <img class="paper-project-img" src="Assets/Images/paperimg2.png" alt="Gulp Project Color">
        </a>
    </div>

    <script src="script.js"></script>
</body>

</html>
