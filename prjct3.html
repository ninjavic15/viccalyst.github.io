<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Funky flyer | Investigation Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: url("img/concrete-texture.png") center/cover no-repeat;
      color: black;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .project-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 2rem;
      gap: 2rem;
    }

    .project-page h1 {
      margin: 0;
      font-size: 35px;
    }

    .project-page p {
      max-width: 800px;
      font-size: 15px;
    }

    .project-images {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .project-images img {
      width: 300px; /* equal size */
      height: 400px;
      object-fit: cover;
      border: 4px solid rgb(204,188,167);
      box-shadow: 2px 2px 12px rgba(0,0,0,0.6);
    }

    .back-btn {
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      padding: 1rem 2rem;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }

  </style>
</head>
<body>
  <!-- Hamburger menu -->
  <div id="menu-placeholder"></div>
  <script src="menu-loader.js"></script>

  <div class="project-page">
    <h1>Project Funky flyer</h1>
    <p>The design blends playful ‘90s–early 2000s typography, soft pastels, and surreal imagery to evoke a dreamy, nostalgic world. Vintage objects in impossible settings create a visually consistent memory loop that feels both familiar and slightly uncanny.</p>

    <div class="project-images">
      <img src="img/flyerf.png" alt="Keyboard Image 1">
      <img src="img/Blikje.png" alt="Keyboard Image 2" style="width: 650px;"> 
      <img src="img/flyerb.png" alt="Keyboard Image 3">
    </div>

    <button class="back-btn" onclick="location.href='index.html'">
      ← Terug naar het bord
    </button>
  </div>
</body>
</html>
