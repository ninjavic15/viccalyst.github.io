<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Page Loader & Orientation Gate overlay -->
    <div id="page-loader" class="page-loader">
        <div class="loader-content">
            <div class="loader-title">Computer Terminal</div>
            <div class="loader-spinner-container">
                <svg class="handdrawn-spinner" viewBox="0 0 50 50">
                    <circle class="spinner-path" cx="25" cy="25" r="20" fill="none"></circle>
                </svg>
            </div>
            <div class="loader-text">Loading System...</div>
            <div class="orientation-gate">
                <div class="phone-rotate-animation"></div>
                <p class="gate-text">Please rotate your device to landscape mode</p>
            </div>
        </div>
    </div>

    <div class="background-container" style="background: radial-gradient(circle at center, #1a1a2e, #0f0f1a);"></div>

    <main class="content-container">
        <div class="glass-panel">
            <h1>Computer Terminal</h1>
            <p>Accessing the main frame... Welcome to the secure computer interface.</p>
            <a href="index.html" class="primary-btn" style="display: inline-block; text-decoration: none; margin-top: 1rem;">Back to Room</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
