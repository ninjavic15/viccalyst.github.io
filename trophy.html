<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trophy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container">
        <img class="background-img" src="Assets/Images/aboutmebkgr.jpg" alt="About Me Background">
    </div>

    <div class="trophy-overlay-images">
        <img class="trophy-overlay-image trophy-overlay-image--mail" src="Assets/Images/aboutmemail.png" alt="About Me Mail">
        <img class="trophy-overlay-image trophy-overlay-image--li" src="Assets/Images/aboutmeli.png" alt="About Me Li">
        <a class="hover-area hotspot-1" href="https://example.com/aboutmemail" target="_blank" rel="noopener noreferrer" aria-label="About Me Mail link"></a>
        <a class="hover-area hotspot-2" href="https://example.com/aboutmeli" target="_blank" rel="noopener noreferrer" aria-label="About Me LinkedIn link"></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
