<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Architects+Daughter&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Page Loader & Orientation Gate overlay -->
    <div id="page-loader" class="page-loader">
        <div class="loader-content">
            <div class="loader-title">About Me</div>
            <div class="loader-spinner-container">
                <svg class="handdrawn-spinner" viewBox="0 0 50 50">
                    <circle class="spinner-path" cx="25" cy="25" r="20" fill="none"></circle>
                </svg>
            </div>
            <div class="loader-text">Loading Journal...</div>
            <div class="orientation-gate">
                <div class="phone-rotate-animation"></div>
                <p class="gate-text">Please rotate your device to landscape mode</p>
            </div>
        </div>
    </div>

    <!-- Tape-styled Back button linking back to index.html -->
    <a href="index.html" class="back-btn" aria-label="Back to Room">&larr; Back to Room</a>

    <!-- Aspect-Ratio Cover Container matching 1920x1080 of the background -->
    <div class="trophy-container">
        <!-- The background drawing notebook -->
        <img class="trophy-bg" src="Assets/Images/aboutmebkgr.jpg" alt="About Me Background">

        <!-- Interactive Project Images (Clickable Links) -->
        <a href="mailto:vic.urb1509@gmail.com" class="trophy-project-link trophy-project-mail"
            aria-label="About Me Mail link">
            <img class="trophy-project-img" src="Assets/Images/aboutmemail.png" alt="About Me Mail">
        </a>
        <a href="https://www.linkedin.com/in/victoria-urba%C5%84ska/" target="_blank" rel="noopener noreferrer"
            class="trophy-project-link trophy-project-li" aria-label="About Me LinkedIn link">
            <img class="trophy-project-img" src="Assets/Images/aboutmeli.png" alt="About Me Li">
        </a>
    </div>

    <script src="script.js"></script>
</body>

</html>
